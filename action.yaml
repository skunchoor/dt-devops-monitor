name: 'Dynatrace DevOps Monitor'
description: 'Unified telemetry sender for all pipeline stages'
author: 'Sunil Kunchoor'
branding:
  icon: 'activity'
  color: 'blue'
inputs:
  dt_url:
    description: 'Dynatrace Environment URL (e.g., https://abc12345.live.dynatrace.com)'
    required: true
  dt_token:
    description: 'Dynatrace API Token with metrics.ingest and events.ingest scopes'
    required: true
  stage:
    description: 'Name of the current pipeline stage (e.g. Build, Snyk Check)'
    required: true
  status:
    description: 'Job status (success/failure)'
    required: true
  metrics_kv:
    description: 'Simple key=value metric (e.g. build.duration=50)'
    required: false
  force_event:
    description: 'Set to true to send an event even if successful (e.g. for Deployments)'
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Send to Dynatrace
      shell: python
      env:
        INPUT_DT_URL: ${{ inputs.dt_url }}
        INPUT_DT_TOKEN: ${{ inputs.dt_token }}
        INPUT_STAGE: ${{ inputs.stage }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_METRICS_KV: ${{ inputs.metrics_kv }}
        INPUT_FORCE_EVENT: ${{ inputs.force_event }}
        # Map GitHub Context automatically
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      # Point to the script in the same directory as this action.yml
      run: |
        import sys
        import os
        # We need to locate the script relative to the action path
        sys.path.append(os.environ['GITHUB_ACTION_PATH'])
        import src.dynatrace as dynatrace
        dynatrace.main()